name: Instalador de Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.16.0 pytest
      - run: python -m pytest -q tests
      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path escritos_procura/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") { throw "La etiqueta $env:GITHUB_REF_NAME no coincide con la versión $v" }
          "v=$v" >> $env:GITHUB_OUTPUT
      - run: pyinstaller --noconfirm EscritosProcura.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.v }} instalador.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EscritosProcura-Instalador
          path: dist/EscritosProcura-Instalador-*.exe
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notas = if (Test-Path "notas/${{ github.ref_name }}.md") { "notas/${{ github.ref_name }}.md" } else { $null }
          if ($notas) { gh release create "${{ github.ref_name }}" dist/EscritosProcura-Instalador-*.exe --title "Escritos Procura ${{ steps.version.outputs.v }}" --notes-file $notas }
          else { gh release create "${{ github.ref_name }}" dist/EscritosProcura-Instalador-*.exe --title "Escritos Procura ${{ steps.version.outputs.v }}" --generate-notes }
