name: Instalador de Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.16.0 pytest
      - run: python -m pytest -q tests
      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path escritos_procura/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "release" -and "${{ github.event.release.tag_name }}" -ne "v$v") { throw "La etiqueta $env:GITHUB_REF_NAME no coincide con la versión $v" }
          "v=$v" >> $env:GITHUB_OUTPUT
      - run: pyinstaller --noconfirm EscritosProcura.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.v }} instalador.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EscritosProcura-Instalador
          path: dist/EscritosProcura-Instalador-*.exe
      - name: Publicar la versión si es nueva
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.v }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { "La versión $tag ya estaba publicada"; exit 0 }
          $exe = (Get-Item dist/EscritosProcura-Instalador-*.exe).FullName
          $args = @($tag, $exe, "--target", "${{ github.sha }}", "--title", "Escritos Procura ${{ steps.version.outputs.v }}")
          if (Test-Path "notas/$tag.md") { $args += @("--notes-file", "notas/$tag.md") } else { $args += "--generate-notes" }
          gh release create @args
